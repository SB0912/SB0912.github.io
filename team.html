    <!-- Bio panel -->

  <script>
    // Placeholder bios: replace with real experience and background.
    const members = {
      slater: {
        name: "Slater Bernstein", role: "Principal",
        bio: "Slater leads Slater Bernstein Consulting Agency, bringing a background in data analysis and forensic data validation. He works alongside legal teams to turn complex data into clear, defensible findings.",
        links: [
          { label: "LinkedIn", href: "https://www.linkedin.com/in/slaterbernstein/", external: true },
          { label: "Email", href: "mailto:slater.bernstein@gmail.com" },
          { label: "Phone", href: "tel:+16125978989" }
        ]
      },
      greg: {
        name: "Greg Bernstein", role: "Partner",
        bio: "As a seasoned Program and Project Manager, Greg brings extensive experience in driving technology solutions that align with business objectives. His ability to navigate the complexities of project lifecycles, coupled with a strategic vision, enables him to optimize performance and ensure a strong return on investment. Throughout his career, he has successfully led diverse projects across various industries, including banking, finance, manufacturing, medical devices, news/media, and retail.",
        links: [
          { label: "LinkedIn", href: "https://www.linkedin.com/in/greg-bernstein-85bb035/", external: true }
        ]
      },
      eric: {
        name: "Eric Sand", role: "Outside Consultant",
        bio: "Eric supports the team as an outside consultant, contributing specialized expertise on projects that call for additional depth.",
        links: [{ label: "Contact the Firm", href: "contact.html" }]
      },
      elit: {
        name: "Elit Sed Do", role: "Janitor",
        bio: "Elit keeps our offices running smoothly and makes sure the team always has a clean, welcoming place to work.",
        links: [{ label: "Contact the Firm", href: "contact.html" }]
      }
    };

    const panel = document.getElementById('bio-panel');
    const buttons = document.querySelectorAll('.team-member');
    let active = null;

    buttons.forEach(btn => btn.addEventListener('click', () => {
      const key = btn.dataset.member;
      if (active === key) {
        panel.classList.add('hidden');
        btn.setAttribute('aria-expanded', 'false');
        active = null;
        return;
      }
      const m = members[key];
      document.getElementById('bio-name').textContent = m.name;
      document.getElementById('bio-role').textContent = m.role;
      document.getElementById('bio-text').textContent = m.bio;
      const links = document.getElementById('bio-links');
      links.replaceChildren(...m.links.map(l => {
        const a = document.createElement('a');
        a.href = l.href;
        a.textContent = l.label;
        a.className = 'btn btn-dark';
        if (l.external) { a.target = '_blank'; a.rel = 'noopener'; }
        return a;
      }));
      buttons.forEach(b => b.setAttribute('aria-expanded', String(b === btn)));
      panel.classList.remove('hidden');
      active = key;
      panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }));
  </script>
